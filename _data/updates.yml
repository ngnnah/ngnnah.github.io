    **Watching**:
    - Princess Mononoke (1997) - classic Ghibli with top-notch animation and story
    - Blue Box (2025) - high school romance, with basketball + badminton; meandering plot and all the cliches

    **Recreational Reading**: 
    - The Lies of Locke Lamora (Gentleman Bastards, Book 1): score=8: conmen in a fantasy world full of dangers and unknowns
    - The Blade Itself (The First Law Trilogy Book 1): score=9: gritty, dark fantasy with morally grey characters who develop into favorites
    - The Narrow Road Between Desires (Kingkiller Chronicle): score=7: side story of a side character, rather slow-paced, unrefined and irrelevant to the main plot
    - The Tombs of Atuan (The Earthsea Cycle Series Book 2): score=8 
    - A Wizard of Earthsea (The Earthsea Cycle Series Book 1): score=8: classic coming-of-age story, similar to Ghibli movies
    - Guns of the Dawn: score=7.5: drier version of anime Yōjo Senki
    - The Grace of Kings (The Dandelion Dynasty Book 1): score=7.5: inspired by Chinese war history, boring characters
    - Convenience Store Woman: A Novel: score=7: short and quirky
    - Assassin's Fate: 16th and final book of the Realm of the Elderlings series: score=9: a satisfying conclusion to a long and fantastic series, took me the whole of 2023 to finish!

    **Listening**: 
    - Me And My Broken Heart by Rixton
    - LUỒN THẲNG VÀO TIM by Cheng, Bùi Công Nam, JayKii, Cao Bá Hưng
    - Lemon by Kenshi Yonezu: karaoke practice target!
    - SAKURA by Ikimonogakari
    - Teru's Song (照るの歌/Teru no Uta) by Aoi Teshima

