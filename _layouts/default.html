<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_newlines | strip }}">
  <meta name="theme-color" content="#16213e">
  <link rel="icon" type="image/png" href="{{ '/images/favicon1a.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/images/favicon1a.png' | relative_url }}">
  <link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">
  <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">
  {% feed_meta %}
</head>
<body>
  <header class="topbar">
    <div class="container">
      <a class="brand" href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>
        <img src="{{ '/images/mark-64.png' | relative_url }}" alt="" width="26" height="26">
        Nhat Nguyen
      </a>
      <nav aria-label="Site">
        <a href="{{ '/#now' | relative_url }}"{% if page.url contains '/updates' %} aria-current="page"{% endif %}>Now</a>
        <a href="{{ '/#writing' | relative_url }}"{% if page.layout == 'post' %} aria-current="page"{% endif %}>Writing</a>
        <a href="{{ '/reading/' | relative_url }}"{% if page.url contains '/reading' %} aria-current="page"{% endif %}>Reading</a>
        <a href="{{ '/I-And-AI/' | relative_url }}">I And AI</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {{ content }}
  </main>

  <footer class="container">
    <p>View source on <a href="https://github.com/ngnnah/ngnnah.github.io">GitHub</a></p>
  </footer>

  <script src="{{ '/js/main.js' | relative_url }}" defer></script>
</body>
</html>
