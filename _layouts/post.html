---
layout: default
---

<main class="container">
  <article class="post">
    <header class="post-header">
      <!-- Sticky title container -->
      <div class="sticky-title-container">
        <h1 class="post-title">{{ page.title }}</h1>
      </div>

      <!-- Non-sticky content -->
      <div class="non-sticky-content">
        {% if page.description %}
        <div class="post-description">{{ page.description }}</div>
        {% endif %}
        <div class="post-date">{{ page.date | date: "%B %-d, %Y" }}</div>
      </div>
    </header>

    {% if page.image %}
    <div class="post-image">
      <img src="{{ page.image }}" alt="{{ page.title }}" loading="lazy" />
    </div>
    {% endif %}

    <div class="post-content">{{ content }}</div>

    <a href="{{ '/' | relative_url }}" class="back-to-home">← Back to home</a>
  </article>
</main>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    // Make title sticky on scroll
    const titleContainer = document.querySelector(".sticky-title-container");

    window.addEventListener("scroll", function () {
      if (window.scrollY > 10) {
        titleContainer.classList.add("scrolled");
      } else {
        titleContainer.classList.remove("scrolled");
      }
    });
  });
</script>
