---
layout: default
---

<main class="container">
    <article class="post">
        <header class="post-header">
            <h1 class="post-title">{{ page.title }}</h1>
            <div class="post-date">{{ page.date | date: "%B %-d, %Y" }}</div>
        </header>
        
        <div class="post-content">
            {{ content }}
        </div>
        
        <a href="{{ '/' | relative_url }}" class="back-to-home">← Back to home</a>
    </article>
</main>
